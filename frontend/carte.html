<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carte des zones - ClearWay Bénin</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icone-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3460">
<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<script src="js/theme.js"></script>
</head>
<body>

<div class="ecran ecran-carte">
  <div class="header header-nav">
    <a href="index.html" aria-label="Retour">&#8592;</a>
    <h1>Carte des zones</h1>
  </div>

  <div class="carte-conteneur">
    <div id="carte-zones" role="application" aria-label="Carte des voies signalées à Cotonou"></div>

    <button type="button" id="btn-localiser" class="btn-localiser" aria-label="Me localiser">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
      </svg>
    </button>
  </div>
  <div class="carte-legende">
    <div class="carte-legende-item">
      <span class="pastille-legende pastille-rouge"></span> Bloquée
    </div>
    <div class="carte-legende-item">
      <span class="pastille-legende pastille-orange"></span> Ralentie
    </div>
    <div class="carte-legende-item">
      <span class="pastille-legende pastille-vert"></span> Dégagée
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="js/sw-register.js"></script>
<script src="js/modal.js"></script>
<script src="js/carte.js"></script>
</body>
</html>
